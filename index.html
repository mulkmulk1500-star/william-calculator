<!doctype html>
<html lang="ko">
<head>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="생산준비">
  <meta name="mobile-web-app-capable" content="yes">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="color-scheme" content="light">
  <meta name="description" content="윌리엄 자일리톨 생산 준비용 간편 계산기">
  <title>WILLIAM · 생산 준비 계산기</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --surface: rgba(255,255,255,.94);
      --card: #ffffff;
      --line: #e6ecf7;
      --text: #182338;
      --sub: #6c7a93;
      --muted: #93a0b7;
      --blue: #2f7cff;
      --blue-deep: #1e64f0;
      --blue-soft: #edf4ff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      font-synthesis: none;
      font-variant-numeric: tabular-nums;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body {
      color: var(--text);
      background:
        radial-gradient(ellipse 360px 260px at 12% 10%, rgba(120,163,255,.18), transparent 74%),
        radial-gradient(ellipse 320px 260px at 88% 84%, rgba(152,182,255,.12), transparent 76%),
        var(--bg);
      padding: 22px 16px;
    }
    button, input { font: inherit; }
    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      border: 0;
      background: none;
    }
    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(74,138,255,.35);
      outline-offset: 2px;
    }
    .app {
      width: min(100%, 460px);
      margin: 0 auto;
      padding: 22px 20px 18px;
      border-radius: 32px;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,.9);
      box-shadow: 0 24px 54px rgba(21,40,86,.10), 0 6px 20px rgba(21,40,86,.05);
      overflow: hidden;
      backdrop-filter: blur(20px);
    }
    .hero { margin-bottom: 12px; }
    .hero h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 34px);
      line-height: 1.08;
      font-weight: 850;
      letter-spacing: -.07em;
      white-space: nowrap;
    }
    .hero h1 .accent { color: var(--blue); }
    .hero p {
      margin: 8px 0 0;
      font-size: 13px;
      line-height: 1.3;
      color: var(--sub);
      font-weight: 620;
      letter-spacing: -.02em;
      white-space: nowrap;
    }
    .entry-card {
      position: relative;
      overflow: hidden;
      padding: 16px 16px 14px;
      border-radius: 24px;
      background: linear-gradient(145deg, #f8fbff 0%, #f2f6ff 64%, #eef4ff 100%);
      border: 1px solid #e3ebfb;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.92);
    }
    .entry-card::before {
      content: "";
      position: absolute;
      right: -92px;
      top: -92px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.9), rgba(171,201,255,.45) 42%, rgba(171,201,255,0) 75%);
      pointer-events: none;
    }
    .input-head,
    .entry-line,
    .quick-controls,
    .quick-scroll { position: relative; z-index: 1; }
    .input-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }
    .input-head label {
      font-size: 13px;
      font-weight: 780;
      color: #4d6284;
      letter-spacing: -.02em;
      white-space: nowrap;
    }
    .mix-toggle {
      display: inline-flex;
      flex: none;
      align-items: center;
      gap: 3px;
      padding: 3px;
      border: 1px solid #dce7fa;
      border-radius: 13px;
      background: rgba(226,235,251,.76);
      box-shadow: inset 0 1px 2px rgba(42,76,132,.045);
    }
    .mix-choice {
      min-width: 51px;
      height: 30px;
      padding: 0 10px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1;
      font-weight: 790;
      color: #788ba9;
      white-space: nowrap;
      transition: background .18s, color .18s, transform .18s cubic-bezier(.2,1.5,.35,1), box-shadow .18s;
    }
    .mix-choice[aria-pressed="true"] {
      background: #fff;
      color: #266ef3;
      box-shadow: 0 2px 7px rgba(45,82,144,.13);
    }
    .mix-choice:active { transform: scale(.94); }
    @media (prefers-reduced-motion: reduce) {
      .mix-choice { transition: none; }
    }
    .entry-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 4px 0 10px;
      border-bottom: 1px solid #dbe4f4;
    }
    .entry-line input {
      width: 100%;
      min-width: 0;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      outline: none;
      color: var(--text);
      font-size: clamp(42px, 12vw, 58px);
      line-height: 1.12;
      font-weight: 840;
      letter-spacing: -.08em;
      caret-color: var(--blue);
    }
    .entry-line input::placeholder { color: #b7c3d7; }
    .kg-suffix {
      flex: none;
      color: #6f88b1;
      font-size: 20px;
      font-weight: 760;
      letter-spacing: -.03em;
      white-space: nowrap;
    }
    .quick-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .quick-title {
      flex: none;
      font-size: 11px;
      font-weight: 760;
      color: var(--muted);
      letter-spacing: -.02em;
      white-space: nowrap;
    }
    .quick-scroll {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .quick-scroll::-webkit-scrollbar { display: none; }
    .quick {
      flex: none;
      min-width: 52px;
      min-height: 34px;
      padding: 0 11px;
      border-radius: 12px;
      background: rgba(255,255,255,.86);
      border: 1px solid #dae4f6;
      color: #4f6688;
      font-size: 12px;
      font-weight: 760;
      box-shadow: 0 2px 6px rgba(46,84,153,.04);
      transition: transform .18s cubic-bezier(.16,1.6,.32,1), background .18s, color .18s, border-color .18s;
      white-space: nowrap;
    }
    .quick:hover { background: #fff; color: var(--blue-deep); border-color: #bfd2ff; }
    .quick:active, .clear:active, .copy:active { transform: scale(.94); }
    .clear {
      flex: none;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: #8397b5;
      background: rgba(255,255,255,.4);
      transition: transform .18s cubic-bezier(.16,1.6,.32,1), background .18s, color .18s;
    }
    .clear:hover { background: rgba(232,239,252,.92); color: #386dd0; }
    .clear svg { width: 17px; height: 17px; }
    .error {
      display: none;
      margin: 8px 1px 0;
      color: #b54259;
      font-size: 11px;
      font-weight: 650;
    }
    .error.visible { display: block; }
    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 14px 2px 9px;
    }
    .section-heading h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.1;
      font-weight: 820;
      letter-spacing: -.045em;
      white-space: nowrap;
    }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #7f8ca2;
      font-size: 11px;
      font-weight: 780;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .live::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #29c98b;
      box-shadow: 0 0 0 3px rgba(41,201,139,.14);
    }
    /* All four results share one compact, legible row design. */
    .result-list { display: grid; gap: 8px; }
    .result-row {
      min-width: 0;
      min-height: 69px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid #e6edf7;
      border-radius: 19px;
      background: #f9fbff;
    }
    .result-row.primary {
      background: linear-gradient(120deg, #f1f7ff, #eaf3ff);
      border-color: #dbe9ff;
    }
    .result-row.separate {
      background: linear-gradient(118deg, #edf5ff, #e5f0ff);
      border-color: #cedfff;
    }
    .result-meta {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 0 0 auto;
    }
    .result-index {
      display: grid;
      place-items: center;
      flex: none;
      width: 32px;
      height: 32px;
      border-radius: 11px;
      background: #eaf1ff;
      color: #4283e9;
      font-size: 11px;
      font-weight: 840;
      letter-spacing: -.03em;
    }
    .primary .result-index, .separate .result-index {
      color: #fff;
      background: linear-gradient(150deg, #62a8ff, #307cf1);
    }
    .result-text { display: grid; gap: 3px; min-width: 0; }
    .result-name {
      color: #455a78;
      font-size: 13px;
      font-weight: 790;
      letter-spacing: -.04em;
      line-height: 1.15;
      white-space: nowrap;
    }
    .primary .result-name { color: #235da8; }
    .separate .result-name { color: #245998; }
    .result-note {
      color: #8a9bb4;
      font-size: 10px;
      font-weight: 670;
      line-height: 1.1;
      letter-spacing: -.02em;
      white-space: nowrap;
    }
    .result-value {
      min-width: 0;
      display: flex;
      flex: 0 1 auto;
      align-items: baseline;
      justify-content: flex-end;
      gap: 4px;
      line-height: 1.08;
      color: #192a44;
      white-space: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .result-value::-webkit-scrollbar { display: none; }
    .result-value strong, .result-subvalue strong {
      font-size: clamp(24px, 6.5vw, 29px);
      font-weight: 850;
      letter-spacing: -.065em;
      white-space: nowrap;
    }
    .result-value .unit {
      color: #8192ad;
      font-size: 12px;
      font-weight: 760;
      letter-spacing: -.02em;
      white-space: nowrap;
    }
    .primary .result-value, .separate .result-value { color: #1b65c9; }
    .pair strong, .pair .result-subvalue strong { font-size: clamp(22px, 5.9vw, 28px); }
    .result-subvalue { display: inline-flex; align-items: baseline; gap: 4px; }
    .result-plus { color: #a1b4cf; font-size: 17px; font-weight: 650; margin: 0 1px; }
    .result-value.pop, .result-subvalue.pop { animation: pop .28s cubic-bezier(.2,1,.3,1); }
    @media (max-width: 390px) {
      .result-row { padding: 11px 12px; gap: 6px; }
      .result-meta { gap: 7px; }
      .result-index { width: 28px; height: 28px; border-radius: 9px; }
      .result-name { font-size: 12px; }
      .result-note { font-size: 9px; }
      .result-value strong, .result-subvalue strong { font-size: 25px; }
      .pair strong, .pair .result-subvalue strong { font-size: 21px; }
      .result-value .unit { font-size: 11px; }
      .result-value, .result-subvalue { gap: 3px; }
    }
    .foot {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
    }
    .copy {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 13px;
      border-radius: 13px;
      background: #f3f6fb;
      border: 1px solid #e5ebf5;
      color: #59677f;
      font-size: 12px;
      font-weight: 760;
      transition: transform .18s cubic-bezier(.16,1.6,.32,1), background .18s;
      white-space: nowrap;
    }
    .copy:hover { background: #eaf0fb; }
    .copy svg { width: 14px; height: 14px; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      transform: translate(-50%, 12px) scale(.98);
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      white-space: nowrap;
      padding: 12px 16px;
      border-radius: 14px;
      background: #172237;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 14px 34px rgba(21,36,66,.22);
      transition: transform .24s cubic-bezier(.2,1,.25,1), opacity .22s;
    }
    .toast.visible { transform: translate(-50%,0) scale(1); opacity: 1; }
    @keyframes pop {
      0% { transform: translateY(2px) scale(.98); opacity: .82; }
      65% { transform: translateY(-1px) scale(1.02); opacity: 1; }
      100% { transform: translateY(0) scale(1); }
    }
    .figure.pop, .pallet-figure.pop { animation: pop .28s cubic-bezier(.2,1,.3,1); }
    .install { margin-right: auto; background: #edf4ff; border-color: #dce9ff; color: #2366da; }
    .install[hidden] { display: none; }
    @media (max-width: 520px) {
      body {
        padding: 0;
        background: #fff;
      }
      .app {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        background: #fff;
        padding: max(16px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      }
      .hero h1 { font-size: clamp(26px, 7.6vw, 32px); }
    }
    @media (max-width: 390px) {
      .app { padding-inline: 14px; }
      .quick { min-width: 50px; padding-inline: 10px; }
      .quick-title { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero" aria-label="계산기 소개">
      <h1>생산 준비를 <span class="accent">한 번에</span></h1>
      <p>필요량 · 포대 · 팔레트 구성을 바로 확인하세요.</p>
    </section>

    <section class="entry-card" aria-label="생산량 입력">
      <div class="input-head">
        <label for="kgInput">생산량 입력</label>
        <div class="mix-toggle" role="group" aria-label="배합 비율 선택">
          <button class="mix-choice" type="button" data-mix="20" aria-pressed="false">20%</button>
          <button class="mix-choice" type="button" data-mix="30" aria-pressed="true">30%</button>
        </div>
      </div>
      <div class="entry-line">
        <input id="kgInput" aria-describedby="inputError" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" value="0" placeholder="0">
        <span class="kg-suffix" aria-hidden="true">kg</span>
      </div>
      <div class="quick-controls" aria-label="빠른 추가">
        <span class="quick-title">빠른 추가</span>
        <div class="quick-scroll">
          <button class="quick" type="button" data-preset="25">25</button>
          <button class="quick" type="button" data-preset="50">50</button>
          <button class="quick" type="button" data-preset="100">100</button>
          <button class="quick" type="button" data-preset="200">200</button>
          <button class="quick" type="button" data-preset="1000">1,000</button>
        </div>
        <button class="clear" type="button" id="clearBtn" aria-label="입력값 지우기" title="지우기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <p class="error" id="inputError" role="status">0 이상의 숫자를 입력해 주세요.</p>
    </section>

    <section class="outcome" aria-label="계산 결과">
      <div class="section-heading"><h2>계산 결과</h2></div>
      <div class="result-list">
        <article class="result-row primary" aria-label="배합 필요량">
          <div class="result-meta">
            <span class="result-index" aria-hidden="true">01</span>
            <span class="result-text"><span class="result-name" id="mixResultLabel">30% 필요량</span></span>
          </div>
          <div class="result-value" id="kgFigure"><strong id="resultKg">0</strong><span class="unit">kg</span></div>
        </article>
        <article class="result-row" aria-label="배합 필요 포대">
          <div class="result-meta">
            <span class="result-index" aria-hidden="true">02</span>
            <span class="result-text"><span class="result-name">필요 포대</span></span>
          </div>
          <div class="result-value" id="bagFigure"><strong id="resultBags">0</strong><span class="unit">포대</span></div>
        </article>
        <article class="result-row" aria-label="전체 팔레트 구성">
          <div class="result-meta">
            <span class="result-index" aria-hidden="true">03</span>
            <span class="result-text"><span class="result-name">팔레트 구성</span></span>
          </div>
          <div class="result-value pair" id="palletFigure">
            <strong id="resultPallets">0</strong><span class="unit">PL</span><span class="result-plus" aria-hidden="true">+</span>
            <span class="result-subvalue" id="remainFigure"><strong id="resultRemainder">0</strong><span class="unit">포대</span></span>
          </div>
        </article>
        <article class="result-row separate" aria-label="배합용 포대를 제외한 별도 준비량">
          <div class="result-meta">
            <span class="result-index" aria-hidden="true">04</span>
            <span class="result-text">
              <span class="result-name">별도 준비량</span>
              <span class="result-note">배합용 포대 제외</span>
            </span>
          </div>
          <div class="result-value pair" id="separateFigure">
            <strong id="resultSeparatePallets">0</strong><span class="unit">PL</span><span class="result-plus" aria-hidden="true">+</span>
            <span class="result-subvalue"><strong id="resultSeparateBags">0</strong><span class="unit">포대</span></span>
          </div>
        </article>
      </div>
    </section>

    <footer class="foot">
      <button class="copy install" id="installBtn" type="button" hidden aria-label="홈 화면에 설치하기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 16v4h16v-4"/></svg>
        앱 설치
      </button>
      <button class="copy" id="copyBtn" type="button" aria-label="계산 결과 복사">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
        결과 복사
      </button>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';
      const input = document.getElementById('kgInput');
      const error = document.getElementById('inputError');
      const toast = document.getElementById('toast');
      const presets = [...document.querySelectorAll('[data-preset]')];
      const mixButtons = [...document.querySelectorAll('[data-mix]')];
      const mixResultLabel = document.getElementById('mixResultLabel');
      let mixPercent = 30;
      const clearBtn = document.getElementById('clearBtn');
      const copyBtn = document.getElementById('copyBtn');
      const storageKey = 'william-prep-calculator-v3';
      const legacyKeys = ['william-prep-calculator-v2', 'mallang-calculator-kg-v1'];
      const outputs = {
        kg: document.getElementById('resultKg'),
        bags: document.getElementById('resultBags'),
        pallets: document.getElementById('resultPallets'),
        remainder: document.getElementById('resultRemainder'),
        separatePallets: document.getElementById('resultSeparatePallets'),
        separateBags: document.getElementById('resultSeparateBags')
      };
      const figures = {
        kg: document.getElementById('kgFigure'),
        bags: document.getElementById('bagFigure'),
        pallets: document.getElementById('palletFigure'),
        remainder: document.getElementById('remainFigure'),
        separatePallets: document.getElementById('separateFigure'),
        separateBags: document.getElementById('separateFigure')
      };
      const formatter = new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 6 });
      let current = null;
      let firstRender = true;
      let toastTimer;

      function parseAmount(text) {
        const cleaned = String(text).replace(/,/g, '').trim();
        if (!cleaned) return null;
        if (!/^(?:\d+\.?\d*|\.\d+)$/.test(cleaned)) return null;
        const n = Number(cleaned);
        return Number.isFinite(n) && n >= 0 && n <= 1e12 ? n : null;
      }

      function formatNumber(n) {
        return formatter.format(n);
      }

      function calculate(kg, percent) {
        const requiredKg = kg * percent / 100;
        const bags = requiredKg / 25;
        const totalBags = kg / 25;
        const pallets = Math.floor(totalBags / 20);
        const remainder = totalBags - pallets * 20;
        // Different preparation locations: separate the mixing bags from the total.
        // Keep fractional bag quantities as calculated; do not round to whole bags.
        const separateBagsTotal = Math.max(0, totalBags - bags);
        const separatePallets = Math.floor(separateBagsTotal / 20);
        const separateBags = Math.max(0, separateBagsTotal - separatePallets * 20);
        return { kg: requiredKg, bags, pallets, remainder, separatePallets, separateBags };
      }

      function popFigure(el) {
        if (firstRender || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        el.classList.remove('pop');
        void el.offsetWidth;
        el.classList.add('pop');
      }

      function update() {
        const kg = parseAmount(input.value);
        current = kg;
        const invalid = kg === null && input.value.trim() !== '';
        error.classList.toggle('visible', invalid);
        input.setAttribute('aria-invalid', String(invalid));

        mixResultLabel.textContent = `${mixPercent}% 필요량`;
        mixButtons.forEach(button => {
          button.setAttribute('aria-pressed', String(Number(button.dataset.mix) === mixPercent));
        });

        const result = kg === null ? null : calculate(kg, mixPercent);
        Object.keys(outputs).forEach((key) => {
          const next = result ? formatNumber(result[key]) : '—';
          if (outputs[key].textContent !== next) {
            outputs[key].textContent = next;
            popFigure(figures[key]);
          }
        });

        try { localStorage.setItem(storageKey, input.value); } catch (_) {}
        firstRender = false;
      }

      function inform(message) {
        toast.textContent = message;
        toast.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('visible'), 1800);
      }

      function setFormattedValue(numberValue) {
        input.value = formatNumber(numberValue);
        update();
      }

      mixButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const next = Number(button.dataset.mix);
          if (next !== 20 && next !== 30) return;
          mixPercent = next;
          update();
        });
      });

      presets.forEach((button) => {
        button.addEventListener('click', () => {
          const add = Number(button.dataset.preset || 0);
          const base = parseAmount(input.value) ?? 0;
          setFormattedValue(base + add);
        });
      });

      clearBtn.addEventListener('click', () => {
        input.value = '';
        update();
        input.focus();
      });

      input.addEventListener('input', update);
      input.addEventListener('blur', () => {
        const value = parseAmount(input.value);
        if (value !== null) input.value = formatNumber(value);
      });
      input.addEventListener('focus', () => input.select());

      copyBtn.addEventListener('click', async () => {
        if (current === null) {
          inform('먼저 생산량을 입력해 주세요.');
          return;
        }
        const content = [
          `생산량: ${formatNumber(current)} kg`,
          `${mixPercent}% 필요량: ${outputs.kg.textContent} kg`,
          `필요 포대: ${outputs.bags.textContent} 포대`,
          `팔레트 구성: ${outputs.pallets.textContent} PL / 잔여 ${outputs.remainder.textContent} 포대`,
          `별도 준비량(배합 제외): ${outputs.separatePallets.textContent} PL + ${outputs.separateBags.textContent} 포대`
        ].join('\n');

        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(content);
          } else {
            const textarea = document.createElement('textarea');
            textarea.value = content;
            textarea.setAttribute('readonly', '');
            textarea.style.cssText = 'position:fixed;left:-9999px;top:0';
            document.body.appendChild(textarea);
            textarea.select();
            const copied = document.execCommand('copy');
            textarea.remove();
            if (!copied) throw new Error('copy failed');
          }
          inform('계산 결과를 복사했어요.');
        } catch (_) {
          inform('이 환경에서는 복사가 제한돼요.');
        }
      });

      try {
        const saved = localStorage.getItem(storageKey);
        if (saved !== null) {
          input.value = saved;
        } else {
          for (const key of legacyKeys) {
            const legacy = localStorage.getItem(key);
            if (legacy !== null) {
              input.value = legacy;
              break;
            }
          }
        }
      } catch (_) {}

      update();

      // PWA: Keep the calculator usable offline after the first HTTPS visit.
      const secureHost = location.protocol === 'https:' ||
        ['localhost', '127.0.0.1'].includes(location.hostname);
      if ('serviceWorker' in navigator && secureHost) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }

      const installBtn = document.getElementById('installBtn');
      const standalone = window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
      let installPrompt = null;
      const isiOS = /iPad|iPhone|iPod/i.test(navigator.userAgent);
      if (!standalone && isiOS && secureHost) installBtn.hidden = false;
      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        if (standalone) return;
        installPrompt = event;
        installBtn.hidden = false;
      });
      window.addEventListener('appinstalled', () => {
        installPrompt = null;
        installBtn.hidden = true;
      });
      installBtn.addEventListener('click', async () => {
        if (installPrompt) {
          const event = installPrompt;
          installPrompt = null;
          installBtn.hidden = true;
          try { await event.prompt(); } catch (_) {}
        } else if (isiOS) {
          inform('Safari 공유 메뉴 → 홈 화면에 추가');
        } else {
          inform('브라우저 메뉴에서 앱 설치를 선택하세요.');
        }
      });
    })();
  </script>
</body>
</html>
